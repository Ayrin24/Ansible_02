---
- name: Install Clickhouse
  hosts: clickhouse
  become: true

  handlers:
    - name: Start clickhouse service
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted

  tasks:
    - name: Install Clickhouse packages block
      block:
        - name: Download clickhouse-common-static
          ansible.builtin.get_url:
            url: "{{ clickhouse_deb_base_url }}/clickhouse-common-static/clickhouse-common-static_{{ clickhouse_version }}_{{ clickhouse_deb_arch }}.deb"
            dest: "/tmp/clickhouse-common-static_{{ clickhouse_version }}_{{ clickhouse_deb_arch }}.deb"
            mode: "0644"

        - name: Download clickhouse-client and clickhouse-server
          ansible.builtin.get_url:
            url: "{{ clickhouse_deb_base_url }}/{{ item }}/{{ item }}_{{ clickhouse_version }}_all.deb"
            dest: "/tmp/{{ item }}_{{ clickhouse_version }}_all.deb"
            mode: "0644"
          loop:
            - clickhouse-client
            - clickhouse-server
      rescue:
        - name: Show download error
          ansible.builtin.debug:
            msg: "Failed to download ClickHouse packages. Check version {{ clickhouse_version }} and network access."

    - name: Install clickhouse-common-static
      ansible.builtin.apt:
        deb: "/tmp/clickhouse-common-static_{{ clickhouse_version }}_{{ clickhouse_deb_arch }}.deb"
        state: present
      notify: Start clickhouse service

    - name: Install clickhouse-client and clickhouse-server
      ansible.builtin.apt:
        deb: "/tmp/{{ item }}_{{ clickhouse_version }}_all.deb"
        state: present
      loop:
        - clickhouse-client
        - clickhouse-server
      notify: Start clickhouse service

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0

- name: Install and configure Vector
  hosts: vector
  become: true

  handlers:
    - name: Restart Vector
      ansible.builtin.systemd:
        name: vector
        state: restarted
        daemon_reload: true

  tasks:
    - name: Create group for Vector
      ansible.builtin.group:
        name: "{{ vector_group }}"
        state: present

    - name: Create user for Vector
      ansible.builtin.user:
        name: "{{ vector_user }}"
        group: "{{ vector_group }}"
        system: true
        create_home: false

    - name: Create download directory
      ansible.builtin.file:
        path: "{{ vector_download_dir }}"
        state: directory
        mode: "0755"

    - name: Download Vector archive
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-{{ vector_arch }}.tar.gz"
        dest: "{{ vector_download_dir }}/vector-{{ vector_version }}.tar.gz"
        mode: "0644"
      register: download_result

    - name: Create installation directory
      ansible.builtin.file:
        path: "{{ vector_install_dir }}"
        state: directory
        owner: "{{ vector_user }}"
        group: "{{ vector_group }}"
        mode: "0755"

    - name: Unarchive Vector
      ansible.builtin.unarchive:
        src: "{{ vector_download_dir }}/vector-{{ vector_version }}.tar.gz"
        dest: "{{ vector_install_dir }}"
        remote_src: true
        extra_opts:
          - "--strip-components=2"
        owner: "{{ vector_user }}"
        group: "{{ vector_group }}"
      when: download_result.changed  # noqa no-handler

    - name: Create symlink for vector binary
      ansible.builtin.file:
        src: "{{ vector_install_dir }}/bin/vector"
        dest: "/usr/local/bin/vector"
        state: link

    - name: Create Vector configuration directory
      ansible.builtin.file:
        path: "{{ vector_config_dir }}"
        state: directory
        owner: "{{ vector_user }}"
        group: "{{ vector_group }}"
        mode: "0755"

    - name: Deploy Vector configuration from template
      ansible.builtin.template:
        src: vector.yaml.j2
        dest: "{{ vector_config_dir }}/vector.yaml"
        owner: "{{ vector_user }}"
        group: "{{ vector_group }}"
        mode: "0644"
      notify: Restart Vector

    - name: Create Vector data directory
      ansible.builtin.file:
        path: "{{ vector_data_dir }}"
        state: directory
        owner: "{{ vector_user }}"
        group: "{{ vector_group }}"
        mode: "0755"

    - name: Deploy systemd unit for Vector
      ansible.builtin.copy:
        dest: /etc/systemd/system/vector.service
        mode: "0644"
        content: |
          [Unit]
          Description=Vector
          Documentation=https://vector.dev
          After=network-online.target
          Requires=network-online.target

          [Service]
          User={{ vector_user }}
          Group={{ vector_group }}
          ExecStart=/usr/local/bin/vector --config {{ vector_config_dir }}/vector.yaml
          Restart=always
          RestartSec=5
          Environment=VECTOR_LOG=info

          [Install]
          WantedBy=multi-user.target
      notify: Restart Vector

    - name: Enable and start Vector
      ansible.builtin.systemd:
        name: vector
        enabled: true
        state: started
        daemon_reload: true
